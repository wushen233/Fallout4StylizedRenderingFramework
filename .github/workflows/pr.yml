name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a stable release (main only; default is candidate build)'
        type: boolean
        default: false
      expected_commit:
        description: 'Exact main commit SHA, required only for publication'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Bash syntax check (*.sh)
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "  bash syntax error in $f" >&2
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: PowerShell parse check (*.ps1)
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1'
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$err) | Out-Null
            if ($err.Count -gt 0) {
              Write-Error "Parse errors in $f"
              foreach ($e in $err) { Write-Error "  $($e.Message) at line $($e.Extent.StartLineNumber)" }
              $failed = 1
            }
          }
          exit $failed

      - name: clang-format check
        shell: pwsh
        run: ./scripts/format.ps1 -Check

  build:
    name: Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      package-name: ${{ steps.package-metadata.outputs.package-name }}
      channel: ${{ steps.release-info.outputs.channel }}
      tag: ${{ steps.release-info.outputs.tag }}
      previous-stable-tag: ${{ steps.release-info.outputs.previous-stable-tag }}
      publish: ${{ steps.release-info.outputs.publish }}

    steps:
      - name: Validate explicit release request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or
              $env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_COMMIT -cne $env:GITHUB_SHA) {
            throw 'Publication requires main and its exact dispatch commit SHA.'
          }

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch FO4 submodules and LFS assets
        shell: pwsh
        run: ./scripts/fetch-submodules.ps1

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Compute release metadata
        id: release-info
        shell: pwsh
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        run: |
          $arguments = @('release-info', "--output=$env:GITHUB_OUTPUT")
          if ($env:PUBLISH_REQUESTED -eq 'true') {
            $arguments += '--dispatch'
          } else {
            $arguments += '--no-publish'
          }
          xmake @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore SDK archive cache
        uses: actions/cache@v6
        with:
          path: .sdk-cache
          key: ${{ runner.os }}-sdk-${{ hashFiles('scripts/sdk-manifest.psd1') }}

      - name: Fetch SDK runtimes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-sdks.ps1 -CacheDirectory .sdk-cache

      - name: Configure
        env:
          RELEASE_IDENTITY: ${{ steps.release-info.outputs.identity }}
        run: xmake f -m releasedbg -y "--release_identity=$env:RELEASE_IDENTITY"

      - name: Build
        run: xmake -y FO4CommunityShaders

      - name: Run unit tests
        run: xmake test -g unit

      # Entries are keyed on recipe and compiler, and revalidated on every hit.
      - name: Restore shader compile cache
        uses: actions/cache@v6
        with:
          path: .shader-test-cache
          key: ${{ runner.os }}-shader-tests-${{ github.sha }}
          restore-keys: ${{ runner.os }}-shader-tests-

      # Each suite already compiles on every core. Keep the three binaries and
      # their tests serial; cold shader corpora can exceed ten minutes on CI.
      - name: Compile runtime shaders
        run: xmake test -j 1 "RuntimeShaderTests/*"

      - name: Compile AE identity and AE/OG feature shaders
        run: xmake test -j 1 "StockShaderIdentityTests/*"

      - name: Compile OG identity shaders
        run: xmake test -j 1 "StockShaderIdentityOGTests/*"

      # Package the tested checkout for internal PRs, main pushes and manual runs.
      - name: Assemble package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: xmake package FO4CommunityShaders

      - name: Verify candidate package and provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_IDENTITY: ${{ steps.release-info.outputs.identity }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        run: ./scripts/verify-candidate-package.ps1

      - name: Upload candidate package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: f4srf-candidate-${{ github.sha }}
          path: |
            build/packages/*.zip
            build/candidate-evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare package metadata
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: package-metadata
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/packages -File -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected one xmake package archive, found $($archives.Count)"
          }
          $packageName = [System.IO.Path]::GetFileNameWithoutExtension($archives[0].Name)
          "package-name=$packageName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download verified package and evidence
        uses: actions/download-artifact@v8
        with:
          name: f4srf-candidate-${{ github.sha }}
          path: dist

      - name: Recheck publication provenance and archive
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ASSET: ${{ needs.build.outputs.package-name }}.zip
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          metadata=dist/candidate-evidence/BUILD-METADATA.json
          jq -e --arg sha "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg run "$GITHUB_RUN_ID" --arg tag "$TAG" --arg asset "$ASSET" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.source_commit == $sha and .source_tree == $tree and
             .workflow_run_id == $run and .repository == $repo and
             .workflow_event == "workflow_dispatch" and .publish_requested == true and
             .build_identity == $tag and .archive == $asset' "$metadata"
          [[ "$ASSET" == "FO4CommunityShaders-$TAG.zip" ]]
          expected=$(jq -er '.archive_sha256' "$metadata")
          [[ "$expected" =~ ^[0-9A-Fa-f]{64}$ ]]
          actual=$(sha256sum "dist/packages/$ASSET" | cut -d ' ' -f 1)
          [[ "${actual,,}" == "${expected,,}" ]]
          mv -- "dist/packages/$ASSET" "dist/$ASSET"

      - name: Publish verified stable archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          PREVIOUS_STABLE_TAG: ${{ needs.build.outputs.previous-stable-tag }}
          ASSET: ${{ needs.build.outputs.package-name }}.zip
        run: bash scripts/publish-release.sh
