# I18N-02: feature summaries, shared menu fields, help and debug labels.
"Adds realistic cloud shadows that move across the landscape, creating dynamic lighting changes as clouds pass overhead, enhancing atmospheric immersion." = "添加随云层移动而掠过地表的真实云影，使光照动态变化，增强环境沉浸感。"
"Real-time environment mapping and reflections." = "实时环境映射与反射。"
"Parallax occlusion mapping for objects and terrain." = "为物体和地形提供视差遮蔽映射。"
"HDR10 output for HDR displays with configurable paper white and peak brightness." = "为 HDR 显示器提供 HDR10 输出，可调整纸白亮度与峰值亮度。"
"LOD terrain and object brightness and gamma matching." = "匹配 LOD 地形与物体的亮度和 Gamma。"
"Simulates realistic ambient lighting by calculating sky occlusion and directional lighting, providing more accurate and natural illumination in outdoor environments." = "通过计算天空遮蔽与方向性光照来模拟真实的环境光，使室外光照更加准确自然。"
"Screen-space subsurface scattering for skin." = "为皮肤提供屏幕空间次表面散射。"
"Stochastic texture sampling that breaks up terrain tiling." = "通过随机纹理采样消除地形纹理的重复平铺感。"
"GGX direct specular and live environment reflections for vanilla materials." = "为原版材质提供 GGX 直接高光与实时环境反射。"
"Screen-space ambient occlusion and indirect lighting." = "屏幕空间环境光遮蔽与间接光照。"
"Detailed screen-space contact shadows." = "精细的屏幕空间接触阴影。"
"Replaces distant terrain water tiles with close water and unifies their optical distance response. Placed water retains its vanilla distance rendering." = "用近距离水面替代远处地形水面区块，并统一其随距离变化的光学表现。独立放置的水体保留原版远距离渲染方式。"
"Downsampled, blurred variance shadow maps of the sun cascades. They soften the sun's soft, rim and back lighting and shadow the sun on water and effects." = "对太阳级联阴影图降采样并模糊，生成方差阴影贴图，使太阳柔光、轮廓光和背光更加柔和，并为水体和特效提供太阳阴影。"
"Projects animated water caustics onto submerged surfaces lit by the sun and adds parallax depth to water normals." = "将动态水面焦散投射到受太阳照射的水下表面，并为水面法线增加视差深度。"
"Weather picker, time controls and per-weather feature overrides." = "天气选择、时间控制及按天气配置功能覆盖。"
"Frame generation for a smoother experience." = "通过帧生成提升画面流畅度。"
"Replaces the game's ambient lighting with physically-based IBL derived from cubemap spherical harmonics." = "使用由立方体贴图球谐函数计算的基于物理的 IBL 替代游戏环境光。"
"Every nearby light on effects and water; inverse-square falloff for authored lights." = "使附近的所有光源影响特效与水体，并为已配置光源提供平方反比衰减。"
"FPS, frame times, draw calls, VRAM usage, and shader performance." = "显示帧率、帧时间、绘制调用、显存用量及着色器性能。"
"Expose Community Shaders tools to the DevBench host for MCP and REST clients." = "通过 DevBench 宿主向 MCP 和 REST 客户端提供 Community Shaders 工具。"
"In-game RenderDoc capture support; adds CPU cost while loaded." = "支持在游戏内使用 RenderDoc 捕获；加载后会增加 CPU 开销。"
"Asynchronous PNG screenshots with HDR10 output, aspect crops and clipboard copy." = "异步保存 PNG 截图，支持 HDR10 输出、宽高比裁剪及复制到剪贴板。"
"Synchronizes godrays and shadows with the actual sun and moon positions in the sky." = "使体积光束与阴影同天空中太阳和月亮的实际位置同步。"
"Blends terrain into objects that sink into it by depth." = "根据嵌入深度混合地形与物体。"
"Terrain shadows from heightmap data." = "基于高度图数据生成地形阴影。"
"DLSS, FSR 3, and FSR 4 super resolution with independently selected frame generation." = "支持 DLSS、FSR 3 和 FSR 4 超分辨率，可独立选择帧生成方式。"
"Appearance" = "外观"
"Higher values make cloud shadows darker." = "数值越高，云影越深。"
